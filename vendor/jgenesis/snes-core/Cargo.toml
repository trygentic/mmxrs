[package]
name = "snes-core"
version = "0.14.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dsp = { path = "../dsp" }
jgenesis-proc-macros = { path = "../jgenesis-proc-macros" }
jgenesis-common = { path = "../jgenesis-common" }

snes-config = { path = "../snes-config" }

spc700-emu = { path = "../spc700-emu" }
wdc65816-emu = { path = "../wdc65816-emu" }

snes-coprocessors = { path = "../snes-coprocessors" }

bincode = { version = "2" }
crc = { version = "3" }
log = { version = "0.4" }
rand = { version = "0.10" }
thiserror = { version = "2" }

