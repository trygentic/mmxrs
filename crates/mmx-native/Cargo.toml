[package]
name = "mmx-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mega Man X desktop frontend (winit/pixels/cpal/gilrs) and headless runner"

[[bin]]
name = "mmxrs"
path = "src/main.rs"

[features]
# Online co-op (--coop-host/--coop-join) over WebRTC. On by default; pulls
# webrtc-rs + ring (needs a C compiler). --no-default-features drops it.
default = ["netplay"]
netplay = ["mmx-net/matchbox"]

[dependencies]
mmx-core = { path = "../mmx-core" }
mmx-net = { path = "../mmx-net" }
winit = { version = "0.30", features = ["rwh_06"] }
pixels = "0.15"
cpal = "0.15"
png = "0.18"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
gilrs = "0.11"

# Apple GameController: Switch Pro, DualShock/DualSense and Xbox pads that
# gilrs's IOKit backend misses or reads no input from (src/gc_pad.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
objc2-game-controller = { version = "0.3", features = ["GCController", "GCExtendedGamepad", "GCControllerElement", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput", "GCPhysicalInputProfile", "GCDevice"] }

[dev-dependencies]
# In-process signalling server for the localhost rollback end-to-end test.
mmx-signal = { path = "../../tools/mmx-signal" }
tokio = { version = "1", features = ["rt-multi-thread"] }
