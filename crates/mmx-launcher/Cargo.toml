[package]
name = "mmx-launcher"
version = "0.1.0"
description = "mmxrs launcher: a small window to pick ROMs and options and start the game (docs/launcher.md)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mmx_launcher"
path = "src/lib.rs"

[[bin]]
name = "mmxrs-launcher"
path = "src/main.rs"

[dependencies]
mmx-core = { path = "../mmx-core" }
# glow (OpenGL) backend only, as in z2-launcher: no second wgpu next to the
# game's. `wayland` + `x11` are loaded at run time on Linux.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
# Native file pickers (XDG portal over D-Bus on Linux, no GTK to build).
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
