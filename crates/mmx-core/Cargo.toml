[package]
name = "mmx-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mega Man X game core: jgenesis SNES emulator wrapper, routine traps, RAM map, co-op"

[dependencies]
snes-core = { git = "https://github.com/trygentic/jgenesis.git", rev = "f39748c2e704b1d27b00f5e0aaac1f133fc14c19" }
wdc65816-emu = { git = "https://github.com/trygentic/jgenesis.git", rev = "f39748c2e704b1d27b00f5e0aaac1f133fc14c19" }
jgenesis-common = { git = "https://github.com/trygentic/jgenesis.git", rev = "f39748c2e704b1d27b00f5e0aaac1f133fc14c19" }
snes-config = { git = "https://github.com/trygentic/jgenesis.git", rev = "f39748c2e704b1d27b00f5e0aaac1f133fc14c19" }
bincode = "2"
# RollbackGame trait for netgame.rs; mmx-net has no dependencies by default.
mmx-net = { path = "../mmx-net" }
crc = "3" # already pulled in by snes-core
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand (via jgenesis-common / snes-core) needs a wasm entropy backend to link.
getrandom = { version = "0.4", features = ["wasm_js"] }
