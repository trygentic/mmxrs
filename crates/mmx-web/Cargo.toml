[package]
name = "mmx-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mega Man X browser frontend: wasm-bindgen Emu + static site/ (see docs/web.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default stays empty: the plain bundle has no WebRTC.
# Online co-op in the browser: matchbox's WebRTC data channels (web-sys,
# js-sys, wasm-bindgen-futures). wasm32 needs no C toolchain.
netplay = ["mmx-net/matchbox"]

[dependencies]
mmx-core = { path = "../mmx-core" }
# Protocol core, zero dependencies unless `netplay` turns on `matchbox`.
mmx-net = { path = "../mmx-net" }
wasm-bindgen = "0.2"

# rand (via vendored jgenesis-common) pulls getrandom; on wasm32 it needs the
# JS backend or the final link has no entropy source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
