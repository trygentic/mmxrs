<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmxrs</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  canvas { width: min(100vw - 24px, 768px); aspect-ratio: 8 / 7; background: #000; /* app.js sets both per frame size */
           image-rendering: pixelated; image-rendering: crisp-edges; }
  body.drag canvas { outline: 2px dashed #4af; }
  #netBox { text-align: center; } #netStatus { font-family: ui-monospace, monospace; font-size: 12px; }
  #status { white-space: pre; font-family: ui-monospace, monospace; font-size: 12px; }
  kbd { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div>
    <input type="file" id="rom" accept=".sfc,.smc,.bin">
    <label><input type="checkbox" id="coop"> local co-op</label>
    <label>Mega Man X3 ROM (optional, enables Zero's sprites and saber) <input type="file" id="x3rom" accept=".sfc,.smc,.bin"></label>
    <label><input type="checkbox" id="zero"> Play as Zero (X3 ROM)</label>
    <label title="extra scenery left and right of the 256-px picture (display only)">Screen <select id="widescreen"><option value="off">4:3</option><option>16:10</option><option>16:9</option><option>21:9</option></select></label>
    <label title="enemies spawn, act and leave 136-160 px further out on both sides, whatever the screen setting; online, both players must tick it before connecting"><input type="checkbox" id="wideGame"> spawn enemies at the wide edges (changes gameplay; both players)</label>
    <label title="runs the SNES CPU faster so busy scenes stop slowing down; auto = 2x with wide gameplay, else off; online, both players must pick the same before connecting">CPU overclock (removes slowdown; both players) <select id="overclock"><option value="auto">auto</option><option value="off">off</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
  </div>
  <div id="netBox">
    <input id="netSignal" value="ws://127.0.0.1:3536" size="22" title="signal server (mmx-signal)">
    <input id="netRoom" placeholder="room" size="10" title="room: 1-32 of A-Z a-z 0-9 _ -">
    <input id="netIce" placeholder="ICE (default STUN; none on a LAN)" size="24">
    <select id="netMode" title="sync mode (both players must pick the same): rollback never waits but the other player can snap on a lossy link; lockstep is smooth but waits when a packet is late"><option value="rollback" selected>rollback</option><option value="lockstep">lockstep</option></select>
    <select id="netDelay" title="input delay in frames (host's wins): rollback 0-3, default 2; lockstep 0-8, default 3"><option value="-1" selected>delay: auto</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
    <button id="netHost">Host</button> <button id="netJoin">Join</button> <button id="netLeave" disabled>Leave</button> <button id="netLog" disabled title="download this session's log (inputs, checksums, stalls) for cargo xtask netreplay">Log</button>
    <div id="netStatus">netplay: idle — enter a room, then Host (player 1) or Join (player 2)</div>
  </div>
  <canvas id="screen" width="256" height="224"></canvas>
  <div id="status">Drop your Mega Man X (USA) ROM here, or pick it above. Nothing is uploaded.</div>
  <small>
    P1 <kbd>arrows</kbd> <kbd>Z</kbd>B <kbd>X</kbd>Y <kbd>C</kbd>A <kbd>V</kbd>X <kbd>A</kbd>/<kbd>B</kbd>L <kbd>S</kbd>/<kbd>N</kbd>R <kbd>Enter</kbd>Start <kbd>Shift</kbd>Select ·
    P2 <kbd>WASD</kbd> <kbd>G</kbd>B <kbd>F</kbd>Y <kbd>H</kbd>A <kbd>T</kbd>X <kbd>R</kbd>L <kbd>Y</kbd>R <kbd>P</kbd>Start <kbd>O</kbd>Select ·
    <kbd>F5</kbd> save <kbd>F7</kbd> load <kbd>Tab</kbd> fast-forward
  </small>
  <script type="module" src="app.js"></script>
</body>
</html>
