# ports.toml: routine ledger for the Mega Man X (USA v1.0) reconstruction.
# Hand-maintained until an extractor exists (docs/PLAN.md "Routine map").
# status: "unported" | "ported" (trap registered) | "verified" (lockstep-clean
# on a movie with the trap on). `cargo xtask ledger` prints the counts.

[meta]
disassembly = "MarkAlarm Mega Man X disassembly (USA v1.0)"
url = "https://github.com/MarkAlarm/MMX1-Disassembly"
commit = "e6d6130"
rom_version = "USA v1.0"
# The listing's bank-$80 PCs drift from the real cartridge by up to 0x41
# (bank $81/$84 matched). Entries with `trace = true` were confirmed with
# `cargo xtask trace --calls`; the others are the listing's numbers, unverified.

[[routine]]
name = "reset"
addr = "80:8000"
status = "unported"

