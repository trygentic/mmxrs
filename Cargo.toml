[workspace]
resolver = "2"
members = [
    "crates/mmx-core",
    "crates/mmx-verify",
    "tools/xtask",
    "crates/mmx-native",
    "crates/mmx-net",
    "tools/mmx-signal",
    "tools/mmx-bridge",
    "crates/mmx-web",
    "crates/mmx-launcher",
]
# Vendored matchbox_socket is a path dependency, not a workspace member.
# jgenesis is now an immutable Git dependency from the Trygentic jgenesis fork.
exclude = ["vendor"]

# matchbox_socket 0.14.0 (MIT OR Apache-2.0) with three small patches, each
# marked `mmxrs patch (from z2rs)` in the source:
#   * browser: ICE gathering waits at most 1 s before the offer/answer is
#     sent, then trickles the rest (upstream waits for gathering to complete,
#     which one unresponsive STUN server stretches to ~40 s);
#   * browser + native: an empty ICE URL list means no ICE servers;
#   * the default signaller builder is exported so mmx-net can observe
#     signalling progress (connecting / waiting for peer / negotiating).
# See docs/netplay.md "Why matchbox is vendored". Drop the patch once upstream
# ships equivalent behaviour.
[patch.crates-io]
matchbox_socket = { path = "vendor/matchbox_socket" }

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.96"

[profile.release]
debug = 1

# Shipped binaries (`make dist`): whole-program LTO, one codegen unit. About
# 9% fewer instructions per frame than release (the emulator core's per-cycle
# tick inlines across crates), same output; slower to build, so day-to-day
# release builds stay as they are.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0

[profile.dev.package."*"]
# The vendored emulator core is unusable unoptimised; z2rs learnt this the hard way.
opt-level = 2
